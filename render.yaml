services:
  - type: web
    name: cafeapp-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: cafeapp-db
          property: connectionString

databases:
  - name: cafeapp-db
    plan: free
    region: oregon
    databaseName: cafeapp
    user: cafe
