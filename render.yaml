services:
  - type: web
    name: cafeapp-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: cafeapp-db
          property: connectionString

databases:
  - name: cafeapp-db
    plan: free
    region: oregon
    databaseName: cafeapp
    user: cafe
