# CafeApp infrastructure
# Usage: docker compose -f infra/docker-compose.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafeapp-postgres
    environment:
      POSTGRES_DB: cafeapp
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafeapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cafeapp-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cafe:cafe@postgres:5432/cafeapp
      PORT: 3000
      TZ: Asia/Kolkata
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-32chars}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      ARGON2_MEMORY_KIB: 19456
      CORS_ORIGINS: http://localhost:5173,http://10.0.2.2:3000
      LOG_LEVEL: info
      QR_TOKEN_BYTES: 32
      QR_BASE_URL: https://cafeapp.local/t/
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"

  adminer:
    image: adminer:4
    container_name: cafeapp-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  pgdata: